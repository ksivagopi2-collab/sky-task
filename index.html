<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Task</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;700&display=swap">
<style>
:root{--p:#2563eb;--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7487;--bd:#e3e7ef;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
body.dark{--bg:#0f141d;--card:#18202c;--tx:#e8edf5;--mu:#93a0b5;--bd:#2a3445}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;font-family:'Noto Sans Tamil',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:76px;min-height:100vh}
header{background:var(--p);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:1.25rem}
header small{opacity:.9}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1}
h2{font-size:1.05rem;margin:4px 0 8px}
.mu{color:var(--mu);font-size:.85rem}
button,.btn{font:inherit;border:0;border-radius:10px;padding:8px 12px;background:var(--p);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--p);border:1px solid var(--p)}
button.sm{padding:4px 9px;font-size:.82rem}
button.red{background:var(--bad)}
input,select,textarea{font:inherit;width:100%;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
textarea{min-height:70px}
label{display:block;font-size:.82rem;color:var(--mu);margin:8px 0 3px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:6}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:8px 0;font-size:.6rem;line-height:1.3}
nav button.on{color:var(--p);font-weight:700}
nav button span{display:block;font-size:1.3rem}
.fab{position:fixed;right:16px;bottom:88px;width:54px;height:54px;border-radius:50%;font-size:1.8rem;padding:0;box-shadow:0 4px 14px #0004;z-index:6}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;color:#fff}
.b-done{background:var(--ok)}.b-part{background:var(--warn)}.b-none{background:#7b8498}
.stat{flex:1;min-width:90px;text-align:center;padding:10px;border-radius:12px;background:var(--bg)}
.stat b{display:block;font-size:1.05rem}
.inc{color:var(--ok)}.exp{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
td.r,th.r{text-align:right}
.bar{height:7px;border-radius:5px;background:var(--p);opacity:.75}
.seg{display:flex;border:1px solid var(--p);border-radius:10px;overflow:hidden}
.seg button{flex:1;border-radius:0;background:transparent;color:var(--p);padding:6px}
.seg button.on{background:var(--p);color:#fff}
.sheet{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;display:block}
.dots i.f{background:#fff}
#lock{position:fixed;inset:0;background:var(--p);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pad button{background:#ffffff26;height:60px;font-size:1.4rem;border-radius:16px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.sw.on{border-color:var(--tx)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:9px 16px;border-radius:99px;z-index:60;font-size:.9rem;max-width:90%}
.imp{border-left:4px solid var(--warn)}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);color:var(--p);padding:1px 8px;border-radius:99px;font-size:.78rem;margin:2px 3px 0 0;cursor:pointer}
.dd{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:.68rem;background:var(--bg);border:1px solid var(--bd);margin-right:3px}
.dd.on{background:var(--ok);color:#fff;border-color:var(--ok)}.dd.na{opacity:.35}
.ovd{border-left:4px solid var(--bad)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.ch{font-size:.7rem;color:var(--mu);padding:2px 0}
.cd{padding:6px 0 3px;border-radius:9px;font-size:.88rem;cursor:pointer;border:1px solid transparent}
.cd.tdy{border-color:var(--p)}.cd.sel{background:var(--p);color:#fff}
.dot{display:block;width:6px;height:6px;border-radius:50%;margin:2px auto 0;background:transparent}
.dot.on{background:var(--ok)}.dot.imp{background:var(--warn)}.cd.sel .dot.on,.cd.sel .dot.imp{background:#fff}
.th{width:72px;height:72px;object-fit:cover;border-radius:8px;margin:3px;cursor:pointer}
.iw{position:relative;display:inline-block}.iw b{position:absolute;top:-2px;right:-2px;background:var(--bad);color:#fff;border-radius:99px;width:20px;height:20px;text-align:center;line-height:20px;font-size:.75rem;cursor:pointer}
.lg{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:.92rem}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
</style>
</head>

<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<script>

 set:{theme:'#2563eb',dark:false,font:16,cur:'INR',lang:'ta'},pin:null,cred:null,habits:[],hlog:{},hval:{},rem:[],shop:[]};

}

function pieSvg(ent){
  const tot=ent.reduce((q,e)=>q+e[1],0);if(!tot)return '';
  let a0=-Math.PI/2,p='';

    if(fr>=0.9999){p+=`<circle cx="70" cy="70" r="62" fill="${c}"/>`;return}
    const a1=a0+fr*2*Math.PI,x0=70+62*Math.cos(a0),y0=70+62*Math.sin(a0),x1=70+62*Math.cos(a1),y1=70+62*Math.sin(a1);
    p+=`<path d="M70 70 L${x0.toFixed(2)} ${y0.toFixed(2)} A62 62 0 ${fr>.5?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${c}"/>`;a0=a1});
  return `<svg viewBox="0 0 140 140" style="width:170px;height:170px;display:block;margin:6px auto">${p}<circle cx="70" cy="70" r="34" fill="var(--card)"/></svg>`;

function trendSvg(l,a,b){

  if(mp==='year'){for(let m=0;m<12;m++){const q=l.filter(x=>parse(x.date).getMonth()===m);pts.push([m+1,sumBy(q,'inc'),sumBy(q,'exp')])}}
  else if(mp==='week'||mp==='month'){for(let d=a;d<=b;d=addDays(d,1)){const q=l.filter(x=>x.date===d);pts.push([parse(d).getDate(),sumBy(q,'inc'),sumBy(q,'exp')])}}
  else return '';
  const W=340,H=120,n=pts.length,bw=W/n,mx=Math.max(1,...pts.map(q=>Math.max(q[1],q[2]))),step=Math.ceil(n/12);
  let g='';
  pts.forEach((q,i)=>{const x=i*bw,w=Math.max(1,bw*.38),h1=q[1]/mx*H,h2=q[2]/mx*H;
    g+=`<rect x="${(x+bw*.08).toFixed(1)}" y="${(H-h1).toFixed(1)}" width="${w.toFixed(1)}" height="${h1.toFixed(1)}" fill="var(--ok)" rx="1"/><rect x="${(x+bw*.08+w).toFixed(1)}" y="${(H-h2).toFixed(1)}" width="${w.toFixed(1)}" height="${h2.toFixed(1)}" fill="var(--bad)" rx="1"/>`;
    if(i%step===0)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H+13}" font-size="9" text-anchor="middle" fill="currentColor" opacity=".6">${q[0]}</text>`});
  return `<svg viewBox="0 0 ${W} ${H+16}" style="width:100%">${g}<line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="currentColor" opacity=".2"/></svg><div class="mu"><span class="inc">■</span> ${lang()==='en'?'Income':'வரவு'} &nbsp; <span class="exp">■</span> ${lang()==='en'?'Expense':'செலவு'}</div>`;
}

async function key(k){
  if(k==='<')buf=buf.slice(0,-1);else if(buf.length<4)buf+=k;
  lockUI($('#lm').textContent,stage==='enter'&&!!S.cred,stage!=='enter');
  if(buf.length<4)return;
  const p=buf;
  if(stage==='enter'){
    if(await hash(p)===S.pin){unlocked=true;$('#lock').hidden=true;buf=''}
    else{buf='';lockUI('தவறான PIN, மீண்டும் முயற்சிக்கவும்',!!S.cred,false)}
  }else if(stage==='new'){first=p;buf='';stage='confirm';lockUI('PIN-ஐ உறுதிப்படுத்தவும்',false,true)}
  else if(stage==='confirm'){
    if(p===first){S.pin=await hash(p);save();buf='';unlocked=true;$('#lock').hidden=true;toast('PIN அமைக்கப்பட்டது');render()}
    else{buf='';stage='new';lockUI('பொருந்தவில்லை. புதிய PIN உள்ளிடவும்',false,true)}

}

function advance(d,rep,anchor){
  const x=parse(d);
  if(rep==='daily')x.setDate(x.getDate()+1);
  else if(rep==='weekly')x.setDate(x.getDate()+7);
  else if(rep==='monthly'){const a=anchor||x.getDate();x.setDate(1);x.setMonth(x.getMonth()+1);x.setDate(Math.min(a,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}
  else if(rep==='yearly'){const a=x.getDate(),m=x.getMonth();x.setDate(1);x.setFullYear(x.getFullYear()+1);x.setMonth(m);x.setDate(Math.min(a,new Date(x.getFullYear(),m+1,0).getDate()))}
  return fmt(x);
}

  const l=S.rem.filter(r=>!r.done&&r.date<=soon).sort((a,b)=>a.date>b.date?1:-1);
  if(!l.length)return '';
  return `<div class="card"><h2>🔔 நினைவூட்டல்கள்</h2>${l.slice(0,4).map(r=>`<div class="row sp ${r.date<t?'exp':''}"><span>${esc(r.title)}${+r.amt?' · '+money(r.amt):''}</span><span class="mu">${r.date===t?'இன்று':r.date<t?'காலதாமதம்':r.date.slice(5)}</span></div>`).join('')}<button class="sm ghost" style="margin-top:8px" onclick="hsub='rem';go('habits')">அனைத்தும்</button></div>`;
}
function habCard(){
  const t=today(),l=S.habits.filter(h=>hSched(h,t));
  return `<div class="card"><h2>🔥 இன்றைய பழக்கங்கள்</h2>${l.length?l.map(h=>`<div class="row sp" style="margin:4px 0"><span>${esc(h.icon)} ${esc(h.name)}</span><button class="sm ${hDone(h,t)?'':'ghost'}" onclick="toggleHabit('${h.id}','${t}')">${hDone(h,t)?'✔':'○'}</button></div>`).join(''):'<div class="mu">இன்னும் பழக்கங்கள் இல்லை.</div>'}<button class="sm ghost" style="margin-top:8px" onclick="hsub='hab';go('habits')">+ புதிய பழக்கம்</button></div>`;
}
// ---------- notifications ----------
async function syncNotifs(){
  const ln=LN();if(!ln)return;
  try{
    let p=await ln.checkPermissions();
    if(p.display!=='granted'){p=await ln.requestPermissions();if(p.display!=='granted')return}
    for(const k of Object.keys(TONES)){try{await ln.createChannel(Object.assign({id:'sky2_'+k,name:'Sky Task - '+(k==='default'?'Phone default':k),description:'Sky Task',importance:5,visibility:1,vibration:true},k==='default'?{}:{sound:'tone_'+k+'.wav'}))}catch(e){}}
    const pd=await ln.getPending();
    if(pd.notifications&&pd.notifications.length)await ln.cancel({notifications:pd.notifications.map(n=>({id:n.id}))});
    const L=[],now=Date.now();let id=1;
    S.rem.filter(r=>!r.done).forEach(r=>{
      let d=r.date,c=0,g=0;const max=(r.rep&&r.rep!=='none')?3:1;
      while(c<max&&g++<500){
        const at=parse(d);const [hh,mm]=(r.time||'09:00').split(':').map(Number);at.setHours(hh,mm,0,0);at.setDate(at.getDate()-(+r.lead||0));
        if(at.getTime()>now){L.push({id:id++,title:'💰 '+r.title,body:(+r.amt?money(r.amt)+' · ':'')+nice(d),schedule:{at,allowWhileIdle:true},channelId:'sky2_'+(r.tone||'default')});c++}
        if(!r.rep||r.rep==='none')break;
        d=advance(d,r.rep,r.anchor);
      }
    });
    S.habits.filter(h=>h.time).forEach(h=>{
      const [hh,mm]=h.time.split(':').map(Number),body=xlStr('இன்றைய பழக்கம்');
      if((h.days||[]).length>=7)L.push({id:id++,title:(h.icon||'🔥')+' '+h.name,body,schedule:{on:{hour:hh,minute:mm},allowWhileIdle:true},channelId:'sky2_'+(h.tone||'default')});
      else (h.days||[]).forEach(dw=>L.push({id:id++,title:(h.icon||'🔥')+' '+h.name,body,schedule:{on:{weekday:dw+1,hour:hh,minute:mm},allowWhileIdle:true},channelId:'sky2_'+(h.tone||'default')}));
    });
    if(L.length)await ln.schedule({notifications:L});
  }catch(e){}
}
async function exactPerm(){
  const ln=LN();if(!ln){toast('APK ஆப்பில் மட்டும்');return}
  try{const r=await ln.checkExactNotificationSetting();
    if(r&&r.exact_alarm==='granted'){toast('துல்லிய நேர அனுமதி ஏற்கனவே உள்ளது ✔');return}
    await ln.changeExactNotificationSetting()}catch(e){toast('Phone Settings → Apps → Sky Task → Alarms & reminders இயக்கவும்')}
}
async function testNotif(){
  const ln=LN();if(!ln){webTest();return}
  try{let p=await ln.requestPermissions();if(p.display!=='granted'){toast('அறிவிப்பு அனுமதி தேவை');return}
    await ln.schedule({notifications:[{id:999999,title:'Sky Task',body:lang()==='en'?'Test notification works!':'சோதனை அறிவிப்பு வேலை செய்கிறது!',schedule:{at:new Date(Date.now()+10000),allowWhileIdle:true}}]});
    toast('அறிவிப்பு 10 வினாடியில் வரும்')}catch(e){toast('அறிவிப்பு அனுமதி தேவை')}
}
// ---------- backup to Drive / file ----------
async function backupFile(){
  const json=JSON.stringify(S),name='SkyTask-backup-'+today()+'.json';
  if(CAP()){
    try{const w=await FS().writeFile({path:name,data:json,directory:'CACHE',encoding:'utf8'});
      await SH().share({title:'Sky Task Backup',text:'Sky Task Backup',files:[w.uri],dialogTitle:'Save to Google Drive'})}
    catch(e){if(!/cancel/i.test(String(e&&e.message||e)))toast('Backup தோல்வி')}
    return}
  try{const f=new File([json],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Sky Task Backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
  backup();
}
function restoreFile(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json,text/plain,*/*';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyRestore(r.result);r.readAsText(f)};i.click();
}
function applyRestore(txt){
  try{const o=JSON.parse(txt);if(!o.tasks||!o.tx)throw 0;S=Object.assign({},DEF,o);S.set=Object.assign({},DEF.set,S.set);save();toast('மீட்டெடுக்கப்பட்டது');syncNotifs();render()}catch(e){toast('தவறான Backup')}
}
// ---------- tones + in-app alerts ----------
const TONES={default:{ta:'போனின் இயல்பு ஒலி',n:[[880,.5]]},bell:{ta:'மணி',n:[[880,.25],[660,.6]]},chime:{ta:'சைம்',n:[[523,.2],[659,.2],[784,.45]]},beep:{ta:'பீப்',n:[[1000,.15],[0,.1],[1000,.15],[0,.1],[1000,.15]]},melody:{ta:'இசை',n:[[392,.2],[494,.2],[587,.2],[784,.55]]},silent:{ta:'அதிர்வு மட்டும்',n:[]}};
const TL=Object.fromEntries(Object.entries(TONES).map(([k,v])=>[k,v.ta]));
function playTone(id){
  const t=TONES[id||'default']||TONES.default;if(!t.n.length)return;
  try{const A=window.AudioContext||window.webkitAudioContext,c=new A();let at=c.currentTime;
    t.n.forEach(([f,d])=>{if(f){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.3,at);g.gain.exponentialRampToValueAtTime(.001,at+d);o.start(at);o.stop(at+d)}at+=d})}catch(e){}
}
const _al={};
function fireAlert(title,body,tone){
  playTone(tone);try{if(window.Notification&&Notification.permission==='granted')new Notification(title,{body})}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  const d=document.createElement('div');d.className='card';d.style.cssText='position:fixed;top:64px;left:10px;right:10px;z-index:70;border:2px solid var(--p);box-shadow:0 6px 20px #0004';
  d.innerHTML='<div class="row sp"><div><b>'+esc(title)+'</b><div class="mu">'+esc(body)+'</div></div><button class="sm" onclick="this.closest(\'.card\').remove()">✖</button></div>';
  document.body.appendChild(d);
}
function checkAlerts(){
  if(CAP())return;
  const now=new Date(),t=today(),hm=pad2(now.getHours())+':'+pad2(now.getMinutes());
  S.rem.filter(r=>!r.done).forEach(r=>{
    const at=parse(r.date);const [hh,mm]=(r.time||'09:00').split(':').map(Number);at.setHours(hh,mm,0,0);at.setDate(at.getDate()-(+r.lead||0));
    const k='r'+r.id+r.date;
    if(at<=now&&now-at<36e5*12&&!_al[k]){_al[k]=1;fireAlert('💰 '+r.title,(+r.amt?money(r.amt)+' · ':'')+nice(r.date),r.tone)}
  });
  S.habits.forEach(h=>{const k='h'+h.id+t+h.time;
    if(h.time&&h.time===hm&&hSched(h,t)&&!hDone(h,t)&&!_al[k]){_al[k]=1;fireAlert((h.icon||'🔥')+' '+h.name,xlStr('இன்றைய பழக்கம்'),h.tone)}});
}
function webTest(){
  try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
  fireAlert('Sky Task',lang()==='en'?'Test alert works!':'சோதனை எச்சரிக்கை வேலை செய்கிறது!','bell');
}
const toneSel=v=>`<label>அறிவிப்பு ஒலி</label><div class="row"><select id="f_tone" class="grow">${Object.keys(TL).map(k=>`<option value="${k}" ${k===(v||'default')?'selected':''}>${TL[k]}</option>`).join('')}</select><button class="ghost sm" onclick="playTone($('#f_tone').value)">கேட்டுப்பார்</button></div>`;
// ---------- shopping lists ----------
let shopOpen=null;
const UNITS={pcs:'பீஸ்',kg:'கிலோ',g:'கிராம்',l:'லிட்டர்',pkt:'பாக்கெட்',dz:'டஜன்'};
const itAmt=(i,got)=>{const r=(got&&i.actual!==''&&i.actual!=null)?+i.actual:+i.rate;return (+i.qty||0)*(+r||0)};
function vShop(){
  const L=S.shop.find(x=>x.id===shopOpen);
  if(!L){
    $('#main').innerHTML=(S.shop.length?S.shop.map(l=>{const n=l.items.length,d=l.items.filter(i=>i.done).length,est=l.items.reduce((s,i)=>s+itAmt(i,false),0);
      return `<div class="card" style="cursor:pointer" onclick="shopOpen='${l.id}';render()"><div class="row sp"><b>🛒 ${esc(l.name)}</b><b>${money(est)}</b></div><div class="mu">${d}/${n} பொருட்கள் வாங்கியது</div></div>`}).join(''):'<div class="card mu">இன்னும் பட்டியல்கள் இல்லை. + அழுத்திச் சேர்க்கவும் (மளிகை, காய்கறி...).</div>')+'<button class="fab" onclick="shopForm()">+</button>';
    return}
  const est=L.items.reduce((s,i)=>s+itAmt(i,false),0),got=L.items.filter(i=>i.done).reduce((s,i)=>s+itAmt(i,true),0),left=L.items.filter(i=>!i.done).reduce((s,i)=>s+itAmt(i,false),0);
  const items=[...L.items.filter(i=>!i.done),...L.items.filter(i=>i.done)];
  $('#main').innerHTML=`<div class="card"><div class="row sp"><button class="ghost sm" onclick="shopOpen=null;render()">◀ பட்டியல்கள்</button><b>🛒 ${esc(L.name)}</b><button class="ghost sm" onclick="shopForm('${L.id}')">திருத்து</button></div>
   <div class="row" style="margin-top:8px"><div class="stat"><b>${money(est)}</b>மதிப்பீடு</div><div class="stat"><b class="inc">${money(got)}</b>வாங்கியது</div><div class="stat"><b class="exp">${money(left)}</b>இன்னும் வாங்க</div></div></div>
  <div class="card"><div class="grid2"><div><label>பொருளின் பெயர்</label><input id="q_name"></div><div><label>விலை (ஒன்றுக்கு)</label><input id="q_rate" type="number" inputmode="decimal"></div></div>
   <div class="grid2"><div><label>எண்ணிக்கை</label><input id="q_qty" type="number" inputmode="decimal" value="1"></div><div><label>அலகு</label><select id="q_unit">${Object.keys(UNITS).map(k=>`<option value="${k}">${UNITS[k]}</option>`).join('')}</select></div></div>
   <button style="margin-top:10px;width:100%" onclick="addItem()">+ பொருள் சேர்</button></div>
  ${items.map(i=>`<div class="card row sp" style="padding:8px"><label style="display:flex;gap:8px;align-items:center;margin:0;color:var(--tx);flex:1"><input type="checkbox" style="width:22px;height:22px" ${i.done?'checked':''} onchange="toggleItem('${i.id}')"><span style="${i.done?'text-decoration:line-through;opacity:.6':''}">${esc(i.name)}<div class="mu">${i.qty} ${UNITS[i.unit]||''} × ${money(i.done&&i.actual!==''&&i.actual!=null?i.actual:i.rate)} = <b>${money(itAmt(i,i.done))}</b></div></span></label><button class="sm ghost" onclick="itemForm('${i.id}')">திருத்து</button></div>`).join('')}
  <div class="row" style="margin-top:6px"><button onclick="postShop()">✔ வாங்கியதைச் செலவாகச் சேர்</button><button class="ghost" onclick="shareShop()">📤 பட்டியலைப் பகிர்</button><button class="ghost" onclick="clearBought()">வாங்கியதை நீக்கு</button></div>`;
}
function curList(){return S.shop.find(x=>x.id===shopOpen)}
function shopForm(id){
  const l=S.shop.find(x=>x.id===id)||{name:''};
  sheet(`<h2>${id?'பட்டியலைத் திருத்து':'புதிய பட்டியல்'}</h2><label>பட்டியலின் பெயர்</label><input id="f_name" value="${escv(l.name)}">
  ${id?`<button class="red sm" style="margin-top:10px" onclick="delItem('shop','${id}')">அழி</button>`:''}${btns()}`,()=>{
    const n=$('#f_name').value.trim();if(!n){toast('பட்டியலின் பெயர் தேவை');return false}
    if(id){l.name=n;save()}else{const o={id:uid(),name:n,items:[]};S.shop.push(o);save();shopOpen=o.id}
  });
}
function addItem(){
  const L=curList();if(!L)return;const n=$('#q_name').value.trim();if(!n){toast('பொருளின் பெயரை உள்ளிடவும்');return}
  L.items.push({id:uid(),name:n,qty:$('#q_qty').value||'1',unit:$('#q_unit').value,rate:$('#q_rate').value,actual:'',done:false});save();render();
  setTimeout(()=>{const e=$('#q_name');if(e)e.focus()},50);
}
function toggleItem(id){const i=curList().items.find(x=>x.id===id);i.done=!i.done;save();render()}
function itemForm(id){
  const L=curList(),i=L.items.find(x=>x.id===id);
  sheet(`<h2>பொருளைத் திருத்து</h2><label>பொருளின் பெயர்</label><input id="f_name" value="${escv(i.name)}">
  <div class="grid2"><div><label>எண்ணிக்கை</label><input id="f_qty" type="number" inputmode="decimal" value="${escv(i.qty)}"></div><div><label>அலகு</label><select id="f_unit">${Object.keys(UNITS).map(k=>`<option value="${k}" ${k===i.unit?'selected':''}>${UNITS[k]}</option>`).join('')}</select></div></div>
  <div class="grid2"><div><label>விலை (ஒன்றுக்கு)</label><input id="f_rate" type="number" inputmode="decimal" value="${escv(i.rate)}"></div><div><label>உண்மை விலை (ஒன்றுக்கு)</label><input id="f_act" type="number" inputmode="decimal" value="${escv(i.actual)}"></div></div>
  <button class="red sm" style="margin-top:10px" id="di">அழி</button>${btns()}`,()=>{
    const n=$('#f_name').value.trim();if(!n){toast('பொருளின் பெயரை உள்ளிடவும்');return false}
    Object.assign(i,{name:n,qty:$('#f_qty').value||'1',unit:$('#f_unit').value,rate:$('#f_rate').value,actual:$('#f_act').value});save();
  });
  $('#di').onclick=()=>{L.items=L.items.filter(x=>x.id!==id);save();closeSheet();render()};
}
function clearBought(){const L=curList();L.items=L.items.filter(i=>!i.done);save();render()}
function postShop(){
  const L=curList(),g=L.items.filter(i=>i.done&&!i.posted);
  if(!g.length){toast('வாங்கிய பொருட்கள் எதுவும் இல்லை');return}
  const amt=g.reduce((s,i)=>s+itAmt(i,true),0);
  sheet(`<h2>🛒 ${esc(L.name)}</h2><label>மொத்தத் தொகை</label><input id="f_amt" type="number" inputmode="decimal" value="${amt}">
  <label>Category</label><select id="f_xc">${S.cats.exp.map(c=>`<option value="${escv(c)}" ${c==='ஷாப்பிங்'?'selected':''}>${cn(c)}</option>`).join('')}</select>${btns()}`,()=>{
    const a=+$('#f_amt').value;if(!(a>0)){toast('தொகை உள்ளிடவும்');return false}
    S.tx.push({id:uid(),type:'exp',date:today(),amt:a,cat:$('#f_xc').value,note:L.name,tags:[]});g.forEach(i=>i.posted=true);save();toast('செலவில் சேர்க்கப்பட்டது');
  });
}
async function shareShop(){
  const L=curList(),txt=L.name+'\n'+L.items.map(i=>(i.done?'✔ ':'☐ ')+i.name+' – '+i.qty+' '+(lang()==='en'?({pcs:'pcs',kg:'kg',g:'g',l:'L',pkt:'pkt',dz:'dozen'})[i.unit]:UNITS[i.unit])+(+i.rate?' × '+money(i.rate):'')).join('\n');
  try{if(CAP()){await SH().share({text:txt,dialogTitle:'Share list'});return}
    if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(/cancel|abort/i.test(String(e&&(e.message||e.name))))return}
  sheet(`<h2>📤</h2><textarea id="bk" style="min-height:160px" readonly>${escv(txt)}</textarea><div class="row" style="margin-top:8px"><button onclick="cp()">நகலெடு</button><button class="ghost" onclick="closeSheet()">மூடு</button></div>`,null);
}
// ---------- init ----------
function tick(){
  const t=today();
  if(t!==window._lastDay){window._lastDay=t;if(cur<t&&view!=='tasks'&&view!=='diary')cur=t;if(manchor<t&&mp==='day')manchor=t;carry();render()}
}
window._lastDay=today();
carry();render();
if(S.pin)showLock();else unlocked=true;
setInterval(tick,30000);
setInterval(checkAlerts,20000);setTimeout(checkAlerts,1500);
setTimeout(syncNotifs,2000);
</script>
