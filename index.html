<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Task</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;700&display=swap">
<style>
:root{--p:#2563eb;--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7487;--bd:#e3e7ef;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
body.dark{--bg:#0f141d;--card:#18202c;--tx:#e8edf5;--mu:#93a0b5;--bd:#2a3445}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;font-family:'Noto Sans Tamil',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:76px;min-height:100vh}
header{background:var(--p);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:1.25rem}
header small{opacity:.9}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.grow{flex:1}
h2{font-size:1.05rem;margin:4px 0 8px}
.mu{color:var(--mu);font-size:.85rem}
button,.btn{font:inherit;border:0;border-radius:10px;padding:8px 12px;background:var(--p);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--p);border:1px solid var(--p)}
button.sm{padding:4px 9px;font-size:.82rem}
button.red{background:var(--bad)}
input,select,textarea{font:inherit;width:100%;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
textarea{min-height:70px}
label{display:block;font-size:.82rem;color:var(--mu);margin:8px 0 3px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;z-index:6}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:8px 2px;font-size:.72rem;line-height:1.3}
nav button.on{color:var(--p);font-weight:700}
nav button span{display:block;font-size:1.3rem}
.fab{position:fixed;right:16px;bottom:88px;width:54px;height:54px;border-radius:50%;font-size:1.8rem;padding:0;box-shadow:0 4px 14px #0004;z-index:6}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;color:#fff}
.b-done{background:var(--ok)}.b-part{background:var(--warn)}.b-none{background:#7b8498}
.stat{flex:1;min-width:90px;text-align:center;padding:10px;border-radius:12px;background:var(--bg)}
.stat b{display:block;font-size:1.05rem}
.inc{color:var(--ok)}.exp{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
td.r,th.r{text-align:right}
.bar{height:7px;border-radius:5px;background:var(--p);opacity:.75}
.seg{display:flex;border:1px solid var(--p);border-radius:10px;overflow:hidden}
.seg button{flex:1;border-radius:0;background:transparent;color:var(--p);padding:6px}
.seg button.on{background:var(--p);color:#fff}
.sheet{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;display:block}
.dots i.f{background:#fff}
#lock{position:fixed;inset:0;background:var(--p);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pad button{background:#ffffff26;height:60px;font-size:1.4rem;border-radius:16px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.sw.on{border-color:var(--tx)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:9px 16px;border-radius:99px;z-index:60;font-size:.9rem;max-width:90%}
.imp{border-left:4px solid var(--warn)}
</style>
</head>
<body>
<div id="lock" hidden></div>
<header><div><h1>☁️ Sky Task</h1><small id="hd"></small></div><div id="hr"></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<script>
// ---------- storage ----------
const KEY='skytask_v1';
let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem}
function save(){const s=JSON.stringify(S);mem=JSON.parse(s);try{localStorage.setItem(KEY,s)}catch(e){}}
const DEF={tasks:[],diary:[],tx:[],cats:{exp:['உணவு','போக்குவரத்து','வீடு/வாடகை','மின்சாரம்/பில்','மருத்துவம்','கல்வி','பொழுதுபோக்கு','ஷாப்பிங்','மற்றவை'],inc:['சம்பளம்','வியாபாரம்','பரிசு','வட்டி','மற்றவை']},
 set:{theme:'#2563eb',dark:false,font:16,cur:'INR',lang:'ta'},pin:null,cred:null};
let S=Object.assign({},DEF,load()||{});
S.set=Object.assign({},DEF.set,S.set||{});
const CUR={INR:['₹','en-IN'],USD:['$','en-US'],EUR:['€','de-DE'],GBP:['£','en-GB'],AED:['AED ','en-US'],SGD:['S$','en-SG'],MYR:['RM ','en-MY'],LKR:['Rs ','en-LK'],AUD:['A$','en-AU'],CAD:['C$','en-CA'],JPY:['¥','ja-JP'],SAR:['SAR ','en-US'],QAR:['QAR ','en-US'],KWD:['KWD ','en-US']};
const TASKCAT='பணி (Task)';
// ---------- helpers ----------
const $=s=>document.querySelector(s);
const escv=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MK='\u2063';
const esc=s=>MK+escv(s)+MK;
const pad2=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>fmt(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const WD=['ஞாயிறு','திங்கள்','செவ்வாய்','புதன்','வியாழன்','வெள்ளி','சனி'];
const MO=['ஜனவரி','பிப்ரவரி','மார்ச்','ஏப்ரல்','மே','ஜூன்','ஜூலை','ஆகஸ்ட்','செப்டம்பர்','அக்டோபர்','நவம்பர்','டிசம்பர்'];
const WDe=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],MOe=['January','February','March','April','May','June','July','August','September','October','November','December'];
const lang=()=>S.set.lang||'ta';
const wdn=i=>lang()==='en'?WDe[i]:WD[i],mon=i=>lang()==='en'?MOe[i]:MO[i];
const nice=s=>{const d=parse(s);return d.getDate()+' '+mon(d.getMonth())+' '+d.getFullYear()+', '+wdn(d.getDay())};
const money=n=>{const[c,l]=CUR[S.set.cur]||CUR.INR;n=+n||0;return (n<0?'-':'')+c+Math.abs(n).toLocaleString(l,{maximumFractionDigits:2})};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ST={done:['முடிந்தது','b-done'],part:['முடியவில்லை (Incomplete)','b-part'],none:['தொடங்கவில்லை','b-none']};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=xlStr(m);document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function nextNo(d){const n=S.tasks.filter(t=>t.date===d).length+1;return 'T'+d.replace(/-/g,'')+'-'+pad2(n)}
// ---------- i18n ----------
const DICT={"முடியவில்லை (Incomplete)": "Incomplete", "முடிந்தது": "Done", "தொடங்கவில்லை": "Not started", "இன்றைக்கு": "Go to today", "இன்று": "Today", "டைரி": "Diary", "பணிகள்": "Tasks", "கணக்கு": "Accounts", "அமைப்பு": "Settings", "வணக்கம்!": "Hello!", "இன்றைய பணிகள்": "Today's tasks", "மொத்தம்": "Total", "நிலுவை": "Pending", "தொடர்ந்தது": "Carried over", "பணிகள் பார்": "View tasks", "நாளைய பணி சேர்": "Add tomorrow's task", "இன்றைய கணக்கு": "Today's accounts", "வரவு": "Income", "செலவு": "Expense", "இன்றைய டைரி": "Today's diary", "குறிப்பு எழுது": "Write a note", "திருத்து": "Edit", "அழி": "Delete", "இந்த நாளுக்கு குறிப்பு இல்லை.": "No notes for this day.", "குறிப்பை திருத்து": "Edit note", "புதிய டைரி குறிப்பு": "New diary note", "தேதி": "Date", "நேரம்": "Time", "தலைப்பு": "Title", "இன்றைய நிகழ்வுகள் / குறிப்புகள்": "Events / notes of the day", "மனநிலை": "Mood", "முக்கிய குறிப்பு": "Important note", "குறிப்பை எழுதவும்": "Please write a note", "தோராய மதிப்பு": "Estimated cost", "தோராய பண மதிப்பு": "Estimated cost", "உண்மைச் செலவு": "Actual cost", "தொடர்ச்சி:": "Continued from:", "மாற்றப்பட்டது:": "Moved to:", "பொருட்கள்": "Materials", "மனித வளம்": "Manpower", "காரணம்": "Reason", "முடியவில்லை": "Not done", "நாளைக்கு": "Tomorrow", "இந்த நாளுக்கு பணி இல்லை. + அழுத்தி சேர்க்கவும்.": "No tasks for this day. Tap + to add one.", "பணியைத் திருத்து": "Edit task", "புதிய பணி": "New task", "பணி எண்": "Task No.", "பணியின் தலைப்பு": "Task title", "பணியின் விவரம்": "Task details", "தேவையான பொருட்கள்": "Materials needed", "தேவையான மனித வளம்": "Manpower needed", "நிலை": "Status", "காரணம் (முடியவில்லை / தொடங்கவில்லை எனில்)": "Reason (if not done / not started)", "தலைப்பு தேவை": "Title is required", "முடியாததற்கான காரணம்": "Reason for not completing", "முடிக்காத பணி அடுத்த நாள் பணியுடன் தானாக இணையும்.": "Unfinished tasks are added to the next day automatically.", "அடுத்த நாளுக்கு இணைக்கப்பட்டது": "Added to the next day", "நாள் வாரியாக": "By day", "நாள்": "Day", "பதிவு இல்லை": "No entries", "மாத வாரியாக": "By month", "மாதம்": "Month", "ஆண்டு": "Year", "வாரம்": "Week", "செலவு – Category வாரியாக": "Expenses by category", "செலவு பதிவு இல்லை": "No expenses", "பதிவுகள்": "Entries", "அனைத்து Category": "All categories", "வரவு + செலவு": "Income + Expense", "செலவு மட்டும்": "Expense only", "வரவு மட்டும்": "Income only", "Filter மொத்தம்": "Filter total", "பதிவைத் திருத்து": "Edit entry", "புதிய பதிவு": "New entry", "தொகை உள்ளிடவும்": "Enter an amount", "தொகை": "Amount", "குறிப்பு": "Note", "மீதம்": "Balance", "தோற்றம்": "Appearance", "நிறத் தீம்": "Colour theme", "எழுத்தின் அளவு": "Font size", "பணக் குறியீடு": "Currency", "இயல்பு": "default", "Category சேர்": "Add category", "புதிய category": "New category", "சேர்க்கப்பட்டது": "Added", "சேர்": "Add", "பாதுகாப்பு இல்லாமல் செயலி திறக்கும்.": "The app will open without protection.", "பாதுகாப்பு": "Security", "PIN மாற்று": "Change PIN", "PIN அமை": "Set PIN", "கைரேகை மீண்டும் பதிவு": "Re-register fingerprint", "கைரேகை / Face ID இயக்கு": "Enable fingerprint / Face ID", "PIN நீக்கு": "Remove PIN", "பக்கம் மறைந்தால் தானாக பூட்டிக்கொள்ளும்.": "Locks automatically when the page is hidden.", "தரவு இந்த சாதனத்தின் browser-இல் சேமிக்கப்படும். Backup எடுத்து வைக்கவும்.": "Data is stored on this device. Please keep a backup.", "Backup நகலெடு": "Copy backup", "இதை நகலெடுத்து பாதுகாப்பான இடத்தில் சேமிக்கவும்.": "Copy this and keep it somewhere safe.", "நகலெடுக்கப்பட்டது": "Copied", "தேர்ந்தெடுத்து நகலெடுக்கவும்": "Select and copy manually", "நகலெடு": "Copy", "மூடு": "Close", "Backup உரையை ஒட்டவும். தற்போதைய தரவு மாற்றப்படும்.": "Paste the backup text. Current data will be replaced.", "மீட்டெடுக்கப்பட்டது": "Restored", "மீட்டெடு": "Restore", "தவறான Backup": "Invalid backup", "அழிக்கவா?": "Delete?", "இதை மீட்க முடியாது.": "This cannot be undone.", "ஆம், அழி": "Yes, delete", "வேண்டாம்": "Cancel", "சேமி": "Save", "ரத்து": "Cancel", "முதலில் அமைப்பில் PIN அமைக்கவும்": "Set a PIN in Settings first", "PIN உள்ளிடவும்": "Enter PIN", "புதிய 4 இலக்க PIN": "New 4-digit PIN", "தவறான PIN, மீண்டும் முயற்சிக்கவும்": "Wrong PIN, try again", "PIN-ஐ உறுதிப்படுத்தவும்": "Confirm PIN", "PIN அமைக்கப்பட்டது": "PIN set", "பொருந்தவில்லை. புதிய PIN உள்ளிடவும்": "Did not match. Enter a new PIN", "PIN நீக்கவா?": "Remove PIN?", "நீக்கு": "Remove", "கைரேகை இயக்கப்பட்டது": "Fingerprint enabled", "இந்த சூழலில் கைரேகை ஆதரவில்லை. PIN பயன்படுத்தவும்.": "Fingerprint is not supported here. Use PIN.", "மொழி / Language": "Language"};
const CATEN={"உணவு": "Food", "போக்குவரத்து": "Transport", "வீடு/வாடகை": "Home/Rent", "மின்சாரம்/பில்": "Electricity/Bills", "மருத்துவம்": "Medical", "கல்வி": "Education", "பொழுதுபோக்கு": "Entertainment", "ஷாப்பிங்": "Shopping", "மற்றவை": "Others", "சம்பளம்": "Salary", "வியாபாரம்": "Business", "பரிசு": "Gift", "வட்டி": "Interest", "பணி (Task)": "Task"};
const DK=Object.keys(DICT).sort((a,b)=>b.length-a.length);
function tr(p){if(lang()!=='en')return p;for(const a of DK){if(p.includes(a))p=p.split(a).join(DICT[a])}return p}
function xlStr(s){return String(s).split(MK).map((p,i)=>i%2?p:tr(p)).join('')}
function xl(root){if(!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const pn=n.parentNode.nodeName;if(pn==='TEXTAREA'||pn==='SCRIPT'||pn==='STYLE')return;n.nodeValue=xlStr(n.nodeValue)});
  root.querySelectorAll('[placeholder]').forEach(e=>e.placeholder=xlStr(e.placeholder));}
const cn=c=>esc(lang()==='en'&&CATEN[c]?CATEN[c]:c);
function setLang(l){S.set.lang=l;save();render()}
function toggleLang(){setLang(lang()==='en'?'ta':'en')}
// ---------- carry over ----------
function carry(){
  const t=today();let again=true,ch=false,guard=0;
  while(again&&guard++<4000){again=false;
    for(const k of S.tasks.slice()){
      if(k.status!=='done'&&!k.carried&&k.date<t){moveNext(k);again=true;ch=true}
    }}
  if(ch)save();return ch;
}
function moveNext(k){
  const nd=addDays(k.date,1);
  S.tasks.push({id:uid(),no:nextNo(nd),date:nd,title:k.title,details:k.details,mat:k.mat,ppl:k.ppl,est:k.est,actual:'',status:'none',reason:'',from:k.no});
  k.carried=nd;
}
// ---------- theme ----------
function applyTheme(){
  document.documentElement.style.fontSize=S.set.font+'px';
  document.documentElement.style.setProperty('--p',S.set.theme);
  document.body.classList.toggle('dark',!!S.set.dark);
}
// ---------- state ----------
let view='today',cur=today(),mp='day',manchor=today(),mf='all',mt='all';
const NAV=[['today','🏠','இன்று'],['diary','📔','டைரி'],['tasks','✅','பணிகள்'],['money','💰','கணக்கு'],['set','⚙️','அமைப்பு']];
function go(v){view=v;render()}
function render(){
  applyTheme();
  $('#nav').innerHTML=NAV.map(n=>`<button class="${view===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');
  $('#hd').textContent=nice(today());
  $('#hr').innerHTML='<button class="sm" style="background:#ffffff33" onclick="toggleLang()">'+(lang()==='en'?'தமிழ்':'EN')+'</button> <button class="sm" style="background:#ffffff33" onclick="lockNow()">🔒</button>';
  ({today:vToday,diary:vDiary,tasks:vTasks,money:vMoney,set:vSet})[view]();
  xl($('#main'));xl($('#nav'));xl($('#hr'));document.documentElement.lang=lang()==='en'?'en':'ta';
}
function dayNav(fn){return `<div class="card row sp"><button class="ghost sm" onclick="${fn}(-1)">◀</button><div style="text-align:center"><b>${nice(cur)}</b>${cur===today()?'<div class="mu">இன்று</div>':'<div><button class="sm ghost" onclick="${fn}(0)">இன்றைக்கு</button></div>'}</div><button class="ghost sm" onclick="${fn}(1)">▶</button></div>`}
function shiftDay(n){cur=n===0?today():addDays(cur,n);render()}
// ---------- money calc ----------
function allTx(){
  const a=S.tx.map(x=>({...x,src:'tx'}));
  S.tasks.forEach(k=>{if(+k.actual>0)a.push({id:k.id,type:'exp',amt:+k.actual,cat:TASKCAT,date:k.date,note:k.no+' '+k.title,src:'task'})});
  return a;
}
function range(p,a){
  if(p==='day')return[a,a];
  if(p==='week'){const d=parse(a);const off=(d.getDay()+6)%7;const s=addDays(a,-off);return[s,addDays(s,6)]}
  const d=parse(a);
  if(p==='month')return[fmt(new Date(d.getFullYear(),d.getMonth(),1)),fmt(new Date(d.getFullYear(),d.getMonth()+1,0))];
  return[d.getFullYear()+'-01-01',d.getFullYear()+'-12-31'];
}
const sumBy=(l,t)=>l.filter(x=>x.type===t).reduce((s,x)=>s+(+x.amt||0),0);
// ---------- TODAY ----------

  const nx=addDays(t,1),nt=S.tasks.filter(k=>k.date===nx).length;

  <div class="card"><h2>வணக்கம்! 👋</h2><div class="mu">${nice(t)}</div></div>
  <div class="card"><h2>இன்றைய பணிகள்</h2>

   <button style="margin-top:8px" onclick="diaryForm()">+ குறிப்பு எழுது</button></div>`;

function statusForm(id,st){

function setStatus(id,st){const k=S.tasks.find(x=>x.id===id);k.status=st;if(st==='done')k.reason='';save();render()}
function manualMove(id){const k=S.tasks.find(x=>x.id===id);moveNext(k);save();toast('அடுத்த நாளுக்கு இணைக்கப்பட்டது');render()}
// ---------- MONEY ----------
function vMoney(){
  const[a,b]=range(mp,manchor);
  let l=allTx().filter(x=>x.date>=a&&x.date<=b);
  const inc=sumBy(l,'inc'),ex=sumBy(l,'exp');
  const cats=[...new Set([...S.cats.exp,...S.cats.inc,TASKCAT])];
  let fl=l.filter(x=>(mf==='all'||x.cat===mf)&&(mt==='all'||x.type===mt)).sort((p,q)=>p.date<q.date?1:-1);
  const byCat={};l.filter(x=>x.type==='exp').forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+(+x.amt));
  const mx=Math.max(1,...Object.values(byCat));
  let daily='';
  if(mp==='week'||mp==='month'){
    const rows=[];for(let d=a;d<=b;d=addDays(d,1)){const q=l.filter(x=>x.date===d);if(q.length)rows.push(`<tr><td>${parse(d).getDate()} ${wdn(parse(d).getDay())}</td><td class="r inc">${money(sumBy(q,'inc'))}</td><td class="r exp">${money(sumBy(q,'exp'))}</td></tr>`)}
    daily=`<div class="card"><h2>நாள் வாரியாக</h2><table><tr><th>நாள்</th><th class="r">வரவு</th><th class="r">செலவு</th></tr>${rows.join('')||'<tr><td colspan=3 class="mu">பதிவு இல்லை</td></tr>'}</table></div>`;
  }
  if(mp==='year'){
    const rows=[];for(let m=0;m<12;m++){const q=l.filter(x=>parse(x.date).getMonth()===m);if(q.length)rows.push(`<tr><td>${mon(m)}</td><td class="r inc">${money(sumBy(q,'inc'))}</td><td class="r exp">${money(sumBy(q,'exp'))}</td></tr>`)}
    daily=`<div class="card"><h2>மாத வாரியாக</h2><table><tr><th>மாதம்</th><th class="r">வரவு</th><th class="r">செலவு</th></tr>${rows.join('')||'<tr><td colspan=3 class="mu">பதிவு இல்லை</td></tr>'}</table></div>`;
  }
  const title={day:nice(a),week:a+' → '+b,month:mon(parse(a).getMonth())+' '+parse(a).getFullYear(),year:''+parse(a).getFullYear()}[mp];
  $('#main').innerHTML=`<div class="seg" style="margin-bottom:10px">${[['day','நாள்'],['week','வாரம்'],['month','மாதம்'],['year','ஆண்டு']].map(p=>`<button class="${mp===p[0]?'on':''}" onclick="mp='${p[0]}';render()">${p[1]}</button>`).join('')}</div>
  <div class="card row sp"><button class="ghost sm" onclick="mShift(-1)">◀</button><b style="text-align:center">${title}</b><button class="ghost sm" onclick="mShift(1)">▶</button></div>
  <div class="card row"><div class="stat"><b class="inc">${money(inc)}</b>வரவு</div><div class="stat"><b class="exp">${money(ex)}</b>செலவு</div><div class="stat"><b>${money(inc-ex)}</b>மீதம்</div></div>
  ${daily}
  <div class="card"><h2>செலவு – Category வாரியாக</h2>${Object.keys(byCat).length?Object.entries(byCat).sort((p,q)=>q[1]-p[1]).map(([c,v])=>`<div style="margin:6px 0"><div class="row sp"><span>${cn(c)}</span><b>${money(v)}</b></div><div class="bar" style="width:${v/mx*100}%"></div></div>`).join(''):'<div class="mu">செலவு பதிவு இல்லை</div>'}</div>
  <div class="card"><h2>பதிவுகள்</h2>
   <div class="grid2"><select onchange="mf=this.value;render()"><option value="all">அனைத்து Category</option>${cats.map(c=>`<option value="${escv(c)}" ${mf===c?'selected':''}>${cn(c)}</option>`).join('')}</select>
   <select onchange="mt=this.value;render()"><option value="all">வரவு + செலவு</option><option value="exp" ${mt==='exp'?'selected':''}>செலவு மட்டும்</option><option value="inc" ${mt==='inc'?'selected':''}>வரவு மட்டும்</option></select></div>
   <div class="mu" style="margin:6px 0">Filter மொத்தம்: <b>${money(sumBy(fl,'inc')-sumBy(fl,'exp'))}</b></div>
   <table>${fl.map(x=>`<tr><td>${x.date.slice(5)}<div class="mu">${cn(x.cat)}</div></td><td>${esc(x.note||'')}${x.src==='task'?' <span class="mu">(Task)</span>':''}</td><td class="r ${x.type}">${x.type==='exp'?'-':'+'}${money(x.amt)}</td><td>${x.src==='tx'?`<button class="sm ghost" onclick="txForm('${x.id}')">✎</button>`:''}</td></tr>`).join('')||'<tr><td class="mu">பதிவு இல்லை</td></tr>'}</table></div>
  <button class="fab" onclick="txForm(null,'exp')">+</button>`;
}
function mShift(n){const d=parse(manchor);
  if(mp==='day')d.setDate(d.getDate()+n);else if(mp==='week')d.setDate(d.getDate()+7*n);else if(mp==='month')d.setMonth(d.getMonth()+n,1);else d.setFullYear(d.getFullYear()+n,0,1);
  manchor=fmt(d);render()}
function txForm(id,type){
  const x=S.tx.find(q=>q.id===id)||{type:type||'exp',date:mp==='day'?manchor:today()};
  sheet(`<h2>${id?'பதிவைத் திருத்து':'புதிய பதிவு'}</h2>
  <div class="seg"><button id="tE" class="${x.type==='exp'?'on':''}" onclick="tt('exp')">செலவு</button><button id="tI" class="${x.type==='inc'?'on':''}" onclick="tt('inc')">வரவு</button></div>
  <input type="hidden" id="f_type" value="${x.type}">
  <label>தேதி</label><input type="date" id="f_date" value="${x.date}">
  <label>தொகை (${CUR[S.set.cur][0].trim()})</label><input type="number" id="f_amt" value="${x.amt||''}" inputmode="decimal">
  <label>Category</label><select id="f_cat"></select>
  <label>குறிப்பு</label><input id="f_note" value="${escv(x.note||'')}">
  ${id?`<button class="red sm" style="margin-top:10px" onclick="delItem('tx','${id}')">அழி</button>`:''}
  ${btns()}`,()=>{
    const amt=+$('#f_amt').value;if(!(amt>0)){toast('தொகை உள்ளிடவும்');return false}
    const o={id:x.id||uid(),type:$('#f_type').value,date:$('#f_date').value||today(),amt,cat:$('#f_cat').value,note:$('#f_note').value};
    upsert('tx',o);manchor=o.date;
  });
  window._cat=x.cat;fillCat();
}
function tt(t){$('#f_type').value=t;$('#tE').classList.toggle('on',t==='exp');$('#tI').classList.toggle('on',t==='inc');fillCat()}
function fillCat(){const t=$('#f_type').value;$('#f_cat').innerHTML=S.cats[t].map(c=>`<option value="${escv(c)}" ${c===window._cat?'selected':''}>${cn(c)}</option>`).join('');xl($('#f_cat'))}

   <div class="mu" style="margin-top:6px">பக்கம் மறைந்தால் தானாக பூட்டிக்கொள்ளும்.</div></div>
  <div class="card"><h2>💾 Backup</h2><div class="mu">தரவு இந்த சாதனத்தின் browser-இல் சேமிக்கப்படும். Backup எடுத்து வைக்கவும்.</div>
   <div class="row" style="margin-top:8px"><button onclick="backup()">Backup நகலெடு</button><button class="ghost" onclick="restore()">மீட்டெடு</button></div></div>`;
}
function addCat(){const n=$('#nc_n').value.trim();if(!n)return;const t=$('#nc_t').value;if(!S.cats[t].includes(n))S.cats[t].push(n);save();toast('சேர்க்கப்பட்டது');$('#nc_n').value=''}
function backup(){const j=JSON.stringify(S);
  sheet(`<h2>Backup</h2><div class="mu">இதை நகலெடுத்து பாதுகாப்பான இடத்தில் சேமிக்கவும்.</div><textarea id="bk" style="min-height:160px" readonly>${escv(j)}</textarea><div class="row" style="margin-top:8px"><button onclick="cp()">நகலெடு</button><button class="ghost" onclick="closeSheet()">மூடு</button></div>`,null);}
function cp(){const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('நகலெடுக்கப்பட்டது'),()=>toast('தேர்ந்தெடுத்து நகலெடுக்கவும்'))}catch(e){toast('தேர்ந்தெடுத்து நகலெடுக்கவும்')}}
function restore(){sheet(`<h2>மீட்டெடு</h2><div class="mu">Backup உரையை ஒட்டவும். தற்போதைய தரவு மாற்றப்படும்.</div><textarea id="rs" style="min-height:160px"></textarea>${btns('மீட்டெடு')}`,()=>{
  try{const o=JSON.parse($('#rs').value);if(!o.tasks||!o.tx)throw 0;S=Object.assign({},DEF,o);S.set=Object.assign({},DEF.set,S.set);save();toast('மீட்டெடுக்கப்பட்டது')}catch(e){toast('தவறான Backup');return false}})}
// ---------- generic ----------
function upsert(k,o){const i=S[k].findIndex(x=>x.id===o.id);if(i>=0)S[k][i]=o;else S[k].push(o);save()}
function delItem(k,id){sheet(`<h2>அழிக்கவா?</h2><div class="mu">இதை மீட்க முடியாது.</div><div class="row" style="margin-top:10px"><button class="red" id="yes">ஆம், அழி</button><button class="ghost" onclick="closeSheet()">வேண்டாம்</button></div>`,null);
  $('#yes').onclick=()=>{S[k]=S[k].filter(x=>x.id!==id);save();closeSheet();render()}}
function btns(t){return `<div class="row" style="margin-top:14px"><button class="grow" id="sv">${t||'சேமி'}</button><button class="ghost" onclick="closeSheet()">ரத்து</button></div>`}
function sheet(h,onsave){$('#modal').innerHTML=`<div class="sheet" onclick="if(event.target===this)closeSheet()"><div>${h}</div></div>`;xl($('#modal'));
  const b=$('#sv');if(b&&onsave)b.onclick=()=>{if(onsave()===false)return;closeSheet();render()}}
function closeSheet(){$('#modal').innerHTML=''}
// ---------- lock ----------
let buf='',stage='enter',first='',unlocked=false;
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sky|'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'sky|'+p)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'h'+h}}
function lockUI(msg,showBio,cancel){
  const L=$('#lock');L.hidden=false;
  L.innerHTML=`<div style="font-size:3rem">☁️</div><h1 style="margin:4px 0">Sky Task</h1><div id="lm">${msg}</div>
  <div class="dots">${[0,1,2,3].map(i=>`<i class="${i<buf.length?'f':''}"></i>`).join('')}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')}<button onclick="${showBio?'bioUnlock()':'void 0'}" style="${showBio?'':'visibility:hidden'}">👆</button><button onclick="key('0')">0</button><button onclick="key('<')">⌫</button></div>
  ${cancel?'<button class="ghost" style="color:#fff;border-color:#fff;margin-top:18px" onclick="cancelPin()">ரத்து</button>':''}`;
  xl(L);
}
function lockNow(){if(!S.pin){toast('முதலில் அமைப்பில் PIN அமைக்கவும்');go('set');return}unlocked=false;showLock()}
function showLock(){buf='';stage='enter';lockUI('PIN உள்ளிடவும்',!!S.cred,false);if(S.cred)setTimeout(bioUnlock,300)}
function setupPin(){buf='';stage='new';first='';lockUI('புதிய 4 இலக்க PIN',false,true)}
function cancelPin(){$('#lock').hidden=true}
async function key(k){
  if(k==='<')buf=buf.slice(0,-1);else if(buf.length<4)buf+=k;
  lockUI($('#lm').textContent,stage==='enter'&&!!S.cred,stage!=='enter');
  if(buf.length<4)return;
  const p=buf;
  if(stage==='enter'){
    if(await hash(p)===S.pin){unlocked=true;$('#lock').hidden=true;buf=''}
    else{buf='';lockUI('தவறான PIN, மீண்டும் முயற்சிக்கவும்',!!S.cred,false)}
  }else if(stage==='new'){first=p;buf='';stage='confirm';lockUI('PIN-ஐ உறுதிப்படுத்தவும்',false,true)}
  else if(stage==='confirm'){
    if(p===first){S.pin=await hash(p);save();buf='';unlocked=true;$('#lock').hidden=true;toast('PIN அமைக்கப்பட்டது');render()}
    else{buf='';stage='new';lockUI('பொருந்தவில்லை. புதிய PIN உள்ளிடவும்',false,true)}
  }
}
function removePin(){sheet(`<h2>PIN நீக்கவா?</h2><div class="mu">பாதுகாப்பு இல்லாமல் செயலி திறக்கும்.</div><div class="row" style="margin-top:10px"><button class="red" id="yes">நீக்கு</button><button class="ghost" onclick="closeSheet()">வேண்டாம்</button></div>`,null);
  $('#yes').onclick=()=>{S.pin=null;S.cred=null;save();closeSheet();render()}}
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const NB=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.BiometricAuth;
async function regBio(){
  if(NB()){try{await NB().authenticate({reason:'Sky Task'});S.cred='native';save();toast('கைரேகை இயக்கப்பட்டது');render()}catch(e){toast('இந்த சூழலில் கைரேகை ஆதரவில்லை. PIN பயன்படுத்தவும்.')}return}
  try{
    const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Sky Task'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'skytask',displayName:'Sky Task'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
    S.cred=b64(c.rawId);save();toast('கைரேகை இயக்கப்பட்டது');render();
  }catch(e){toast('இந்த சூழலில் கைரேகை ஆதரவில்லை. PIN பயன்படுத்தவும்.')}
}
async function bioUnlock(){
  if(!S.cred)return;
  if(S.cred==='native'){try{await NB().authenticate({reason:'Sky Task'});unlocked=true;$('#lock').hidden=true;buf=''}catch(e){}return}
  try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(S.cred)}],userVerification:'required',timeout:60000}});
    unlocked=true;$('#lock').hidden=true;buf=''}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.pin&&unlocked){unlocked=false;showLock()}});
// ---------- init ----------
function tick(){
  const t=today();
  if(t!==window._lastDay){window._lastDay=t;if(cur<t&&view!=='tasks'&&view!=='diary')cur=t;if(manchor<t&&mp==='day')manchor=t;carry();render()}
}
window._lastDay=today();
carry();render();
if(S.pin)showLock();else unlocked=true;
setInterval(tick,30000);
</script>
</body>
</html>
