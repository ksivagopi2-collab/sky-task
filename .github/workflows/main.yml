name: Build Sky Task APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www && cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Create notification tones
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import wave, struct, math
          tones = {
            'bell': [(880,.35),(660,.5),(880,.35),(660,.5),(880,.35),(660,.5)],
            'chime': [(523,.25),(659,.25),(784,.5),(523,.25),(659,.25),(784,.5)],
            'beep': [(1000,.2),(0,.1)]*8,
            'melody': [(392,.25),(494,.25),(587,.25),(784,.6),(392,.25),(494,.25),(587,.25),(784,.6)],
            'silent': [(0,.3)],
          }
          rate = 22050
          for name, notes in tones.items():
              frames = []
              for f, d in notes:
                  n = int(rate * d)
                  for i in range(n):
                      env = 1.0 if i > 200 else i / 200.0
                      v = 0.0 if f == 0 else math.sin(2 * math.pi * f * i / rate) * env * 0.97
                      frames.append(struct.pack('<h', int(v * 32767)))
              w = wave.open('android/app/src/main/res/raw/tone_%s.wav' % name, 'wb')
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(rate)
              w.writeframes(b''.join(frames))
              w.close()
          PY
      - run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.USE_BIOMETRIC"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Use fixed signing key (so updates install over the old app)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/sky.keystore
            mkdir -p ~/.android && cp android/app/sky.keystore ~/.android/debug.keystore
            sed -i "0,/^android {/s##android {\n    signingConfigs {\n        debug {\n            storeFile file('sky.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }#" android/app/build.gradle
            echo "Using fixed key"
            keytool -list -keystore android/app/sky.keystore -storepass android | grep -i "fingerprint" || true
          else
            echo "No key secret found - using a random key"
          fi
      - run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SkyTask-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Show APK signature fingerprint
        run: |
          AP=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AP verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" || true
